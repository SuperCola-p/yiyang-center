<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title th:text="'床位管理'">床位管理</title>
    <th:block layout:fragment="head-extra">
        <style>
            /* ===== 可视化床位布局专属样式 ===== */

            /* --- 楼栋总览卡片 --- */
            .building-card {
                border-radius: 14px;
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
                border: none;
                margin-bottom: 24px;
                overflow: hidden;
                transition: box-shadow 0.2s;
            }
            .building-card:hover {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
            }
            .building-card .card-header {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: #fff;
                font-weight: 700;
                font-size: 1.05rem;
                padding: 14px 20px;
                border: none;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: space-between;
                transition: all 0.2s;
            }
            .building-card .card-header:hover {
                filter: brightness(1.08);
            }
            .building-card .card-header .building-info {
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .building-card .card-header .building-info i {
                font-size: 1.3rem;
            }
            .building-card .card-header .stats-badge {
                display: flex;
                gap: 10px;
                font-size: 0.78rem;
            }
            .building-card .card-header .stats-badge span {
                background: rgba(255, 255, 255, 0.2);
                padding: 3px 12px;
                border-radius: 20px;
                font-weight: 500;
            }
            .building-card .card-header .arrow-icon {
                transition: transform 0.3s;
            }
            .building-card .card-header[aria-expanded="true"] .arrow-icon {
                transform: rotate(180deg);
            }

            .building-card .card-body {
                padding: 20px;
                background: #fafbff;
            }

            /* --- 概览统计条 --- */
            .floor-overview {
                display: flex;
                gap: 12px;
                margin-bottom: 20px;
                flex-wrap: wrap;
            }
            .floor-stat-item {
                background: #fff;
                padding: 8px 16px;
                border-radius: 10px;
                box-shadow: 0 1px 4px rgba(0,0,0,0.05);
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 0.85rem;
                font-weight: 500;
                color: #4a5568;
            }
            .floor-stat-item .dot {
                width: 12px;
                height: 12px;
                border-radius: 50%;
                display: inline-block;
            }
            .floor-stat-item .dot.dot-free { background: #38ef7d; }
            .floor-stat-item .dot.dot-occupied { background: #f5576c; }
            .floor-stat-item .dot.dot-maintenance { background: #cbd5e0; }
            .floor-stat-item .num {
                font-weight: 700;
                font-size: 1rem;
                color: #2d3748;
            }

            /* --- 房间卡片网格 --- */
            .room-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 16px;
            }

            /* --- 单个房间卡片 --- */
            .room-card {
                background: #fff;
                border-radius: 12px;
                box-shadow: 0 1px 6px rgba(0, 0, 0, 0.06);
                border: 1px solid #f0f0f0;
                overflow: hidden;
                transition: all 0.2s;
            }
            .room-card:hover {
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.10);
                transform: translateY(-2px);
            }
            .room-card .room-header {
                background: linear-gradient(135deg, #f8f9ff 0%, #f0f2f5 100%);
                padding: 10px 14px;
                font-weight: 600;
                font-size: 0.9rem;
                color: #2d3748;
                display: flex;
                align-items: center;
                justify-content: space-between;
                border-bottom: 1px solid #eee;
            }
            .room-card .room-header .room-label {
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .room-card .room-header .room-label i {
                color: #667eea;
            }
            .room-card .room-header .room-occupancy {
                font-size: 0.75rem;
                font-weight: 400;
                color: #a0aec0;
            }

            /* --- 单个床位 --- */
            .room-card .beds-container {
                padding: 12px 14px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .bed-item {
                border-radius: 10px;
                padding: 10px 14px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                cursor: pointer;
                transition: all 0.2s;
                border: 1px solid transparent;
                position: relative;
            }
            .bed-item:hover {
                transform: scale(1.02);
            }

            /* 床位状态颜色 */
            .bed-item.status-free {
                background: #eafff2;
                border-color: #a0f0c0;
            }
            .bed-item.status-free:hover {
                background: #d4fae5;
                border-color: #38ef7d;
                box-shadow: 0 0 0 3px rgba(56, 239, 125, 0.15);
            }

            .bed-item.status-occupied {
                background: #fff0f0;
                border-color: #fcc;
            }
            .bed-item.status-occupied:hover {
                background: #ffe3e3;
                border-color: #f5576c;
                box-shadow: 0 0 0 3px rgba(245, 87, 108, 0.12);
            }

            .bed-item.status-maintenance {
                background: #f5f6f8;
                border-color: #e2e8f0;
            }
            .bed-item.status-maintenance:hover {
                background: #edf0f5;
                border-color: #cbd5e0;
            }

            /* 床位左侧信息 */
            .bed-item .bed-left {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .bed-item .bed-left .bed-icon {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 0.9rem;
                color: #fff;
            }
            .bed-item.status-free .bed-icon { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
            .bed-item.status-occupied .bed-icon { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
            .bed-item.status-maintenance .bed-icon { background: #a0aec0; }

            .bed-item .bed-left .bed-label {
                font-weight: 600;
                font-size: 0.9rem;
                color: #2d3748;
            }
            .bed-item .bed-left .bed-label small {
                font-weight: 400;
                font-size: 0.78rem;
                color: #a0aec0;
                display: block;
            }
            .bed-item .bed-left .bed-occupant {
                font-size: 0.78rem;
                color: #4a5568;
                margin-top: 2px;
            }

            /* 床位右侧操作按钮 */
            .bed-item .bed-actions {
                display: flex;
                gap: 4px;
                opacity: 0;
                transition: opacity 0.2s;
            }
            .bed-item:hover .bed-actions {
                opacity: 1;
            }
            .bed-item .bed-actions .btn-icon {
                width: 28px;
                height: 28px;
                border-radius: 6px;
                border: none;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 0.72rem;
                color: #fff;
                cursor: pointer;
                transition: all 0.15s;
            }
            .bed-item .bed-actions .btn-icon:hover {
                transform: scale(1.15);
            }
            .bed-item .bed-actions .btn-icon.btn-edit { background: #667eea; }
            .bed-item .bed-actions .btn-icon.btn-status { background: #4facfe; }
            .bed-item .bed-actions .btn-icon.btn-assign { background: #38ef7d; color: #1a5c3a; }
            .bed-item .bed-actions .btn-icon.btn-swap { background: #f093fb; }

            /* --- 空房间占位 --- */
            .room-card .empty-room {
                padding: 16px;
                text-align: center;
                color: #cbd5e0;
                font-size: 0.85rem;
            }

            /* --- 搜索栏高亮匹配 --- */
            .search-highlight {
                animation: pulseHighlight 1.5s ease;
            }
            @keyframes pulseHighlight {
                0% { box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.3); }
                100% { box-shadow: 0 0 0 0 rgba(102, 126, 234, 0); }
            }

            /* 响应式调整 */
            @media (max-width: 768px) {
                .room-grid {
                    grid-template-columns: 1fr;
                }
                .bed-item .bed-actions {
                    opacity: 1;  /* 移动端始终显示操作按钮 */
                }
                .floor-overview {
                    gap: 8px;
                }
                .floor-stat-item {
                    padding: 6px 12px;
                    font-size: 0.78rem;
                }
                .building-card .card-header .stats-badge {
                    display: none;
                }
            }

            @media (min-width: 769px) and (max-width: 1200px) {
                .room-grid {
                    grid-template-columns: repeat(2, 1fr);
                }
            }
        </style>
    </th:block>
</head>
<body>
<th:block layout:fragment="content">
    <!-- 页面标题 -->
    <div class="page-title">
        <i class="fas fa-bed"></i> 床位管理
        <span class="ml-auto">
            <span id="totalBeds" class="badge badge-primary mr-2">0 张床位</span>
            <span id="freeCount" class="badge badge-success mr-2">0 空闲</span>
            <span id="occupiedCount" class="badge badge-warning mr-2">0 已入住</span>
            <span id="maintenanceCount" class="badge badge-secondary">0 维修</span>
        </span>
    </div>

    <!-- 搜索栏 -->
    <div class="search-bar">
        <form class="form-inline" onsubmit="searchBeds(); return false;">
            <div class="form-group mr-3">
                <label class="mr-2"><i class="fas fa-building"></i> 楼栋：</label>
                <select class="form-control form-control-sm" id="searchBuilding" style="width:120px;">
                    <option value="">全部</option>
                    <option value="A栋">A栋</option>
                    <option value="B栋">B栋</option>
                </select>
            </div>
            <div class="form-group mr-3">
                <label class="mr-2"><i class="fas fa-door-open"></i> 房间号：</label>
                <input type="number" class="form-control form-control-sm" id="searchRoomNo" placeholder="输入房间号" style="width:110px;">
            </div>
            <div class="form-group mr-3">
                <label class="mr-2"><i class="fas fa-circle"></i> 状态：</label>
                <select class="form-control form-control-sm" id="searchStatus" style="width:100px;">
                    <option value="">全部</option>
                    <option value="1">空闲</option>
                    <option value="2">已入住</option>
                    <option value="3">维修</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-sm mr-2">
                <i class="fas fa-search"></i> 搜索
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm mr-2" onclick="resetSearch()">
                <i class="fas fa-undo"></i> 重置
            </button>
            <a href="/page/beds/add" class="btn btn-success btn-sm">
                <i class="fas fa-plus"></i> 新增床位
            </a>
        </form>
    </div>

    <!-- 加载状态 -->
    <div id="loadingContainer" class="text-center py-5">
        <i class="fas fa-spinner fa-spin fa-2x text-primary"></i>
        <p class="text-muted mt-2">正在加载床位数据...</p>
    </div>

    <!-- 床位可视化容器 -->
    <div id="bedVisualContainer" style="display:none;"></div>

    <!-- 空状态 -->
    <div id="emptyContainer" class="card" style="display:none;">
        <div class="card-body empty-state">
            <i class="fas fa-bed"></i>
            <p>暂无床位数据</p>
        </div>
    </div>

    <!-- 没有匹配结果 -->
    <div id="noMatchContainer" class="card" style="display:none;">
        <div class="card-body empty-state">
            <i class="fas fa-search"></i>
            <p>没有找到匹配的床位</p>
        </div>
    </div>
</th:block>

<th:block layout:fragment="script-extra">
    <script th:inline="none">
        var allBeds = [];

        // ==================== 页面初始化 ====================
        $(function() {
            loadBeds();
        });

        // ==================== 加载床位数据 ====================
        function loadBeds() {
            $('#loadingContainer').show();
            $('#bedVisualContainer').hide();
            $('#emptyContainer').hide();
            $('#noMatchContainer').hide();

            $.get('/api/beds', function(res) {
                if (res.code === 200) {
                    allBeds = res.data || [];
                    renderBeds(allBeds);
                } else {
                    showToast(res.message || '加载床位列表失败', 'error');
                    $('#loadingContainer').hide();
                }
            }).fail(function() {
                showToast('网络异常，加载失败', 'error');
                $('#loadingContainer').hide();
            });
        }

        // ==================== 渲染可视化床位布局 ====================
        function renderBeds(data) {
            $('#loadingContainer').hide();

            if (!data || data.length === 0) {
                $('#emptyContainer').show();
                return;
            }

            // 更新概览统计
            var total = data.length;
            var free = data.filter(function(b) { return b.bedStatus === 1; }).length;
            var occupied = data.filter(function(b) { return b.bedStatus === 2; }).length;
            var maintenance = data.filter(function(b) { return b.bedStatus === 3; }).length;
            $('#totalBeds').text(total + ' 张床位');
            $('#freeCount').text(free + ' 空闲');
            $('#occupiedCount').text(occupied + ' 已入住');
            $('#maintenanceCount').text(maintenance + ' 维修');

            // 按楼栋分组
            var byBuilding = {};
            $.each(data, function(i, bed) {
                var building = bed.building || '未指定';
                if (!byBuilding[building]) {
                    byBuilding[building] = [];
                }
                byBuilding[building].push(bed);
            });

            var buildings = Object.keys(byBuilding).sort();
            var html = '';
            var first = true;

            $.each(buildings, function(bi, building) {
                var beds = byBuilding[building];

                // 按房间分组
                var byRoom = {};
                $.each(beds, function(i, bed) {
                    var roomKey = bed.roomNo || 0;
                    if (!byRoom[roomKey]) {
                        byRoom[roomKey] = [];
                    }
                    byRoom[roomKey].push(bed);
                });

                var roomNos = Object.keys(byRoom).sort(function(a, b) { return parseInt(a) - parseInt(b); });

                // 统计楼栋内各状态数量
                var buildingFree = beds.filter(function(b) { return b.bedStatus === 1; }).length;
                var buildingOccupied = beds.filter(function(b) { return b.bedStatus === 2; }).length;
                var buildingMaint = beds.filter(function(b) { return b.bedStatus === 3; }).length;

                html += '<div class="building-card card">' +
                    '<div class="card-header" data-toggle="collapse" href="#building-' + bi + '" aria-expanded="' + (first ? 'true' : 'false') + '">' +
                    '    <div class="building-info">' +
                    '        <i class="fas fa-building"></i>' +
                    '        <span>' + escapeHtml(building) + '</span>' +
                    '        <span class="stats-badge">' +
                    '            <span><i class="fas fa-bed"></i> ' + beds.length + '</span>' +
                    '            <span style="background:rgba(56,239,125,0.25);color:#eafff2;"><i class="fas fa-check-circle"></i> ' + buildingFree + '</span>' +
                    '            <span style="background:rgba(245,87,108,0.25);color:#ffe0e0;"><i class="fas fa-user"></i> ' + buildingOccupied + '</span>' +
                    '            <span style="background:rgba(203,213,224,0.25);color:#eef0f5;"><i class="fas fa-tools"></i> ' + buildingMaint + '</span>' +
                    '        </span>' +
                    '    </div>' +
                    '    <i class="fas fa-chevron-down arrow-icon"></i>' +
                    '</div>' +
                    '<div id="building-' + bi + '" class="collapse ' + (first ? 'show' : '') + '">' +
                    '    <div class="card-body">';

                // 楼栋概览条
                html += '<div class="floor-overview">' +
                    '    <div class="floor-stat-item"><span class="dot dot-free"></span> 空闲 <span class="num">' + buildingFree + '</span></div>' +
                    '    <div class="floor-stat-item"><span class="dot dot-occupied"></span> 已入住 <span class="num">' + buildingOccupied + '</span></div>' +
                    '    <div class="floor-stat-item"><span class="dot dot-maintenance"></span> 维修 <span class="num">' + buildingMaint + '</span></div>' +
                    '</div>';

                // 房间网格
                html += '<div class="room-grid">';

                $.each(roomNos, function(ri, roomNo) {
                    var roomBeds = byRoom[roomNo];
                    // 房间内各状态
                    var roomOccupied = roomBeds.filter(function(b) { return b.bedStatus === 2; }).length;
                    var totalInRoom = roomBeds.length;

                    html += '<div class="room-card" data-room="' + roomNo + '">' +
                        '<div class="room-header">' +
                        '    <div class="room-label">' +
                        '        <i class="fas fa-door-open"></i>' +
                        '        <span>' + escapeHtml(building) + ' - ' + roomNo + ' 室</span>' +
                        '    </div>' +
                        '    <div class="room-occupancy">' +
                        '        <i class="fas fa-user"></i> ' + roomOccupied + '/' + totalInRoom +
                        '    </div>' +
                        '</div>' +
                        '<div class="beds-container">';

                    // 排序床位：空闲在前，已入住次之，维修最后
                    roomBeds.sort(function(a, b) {
                        return a.bedStatus - b.bedStatus;
                    });

                    $.each(roomBeds, function(bi2, bed) {
                        var statusClass = 'status-free';
                        var statusIcon = 'fa-check-circle';
                        var statusLabel = '空闲';
                        if (bed.bedStatus === 2) {
                            statusClass = 'status-occupied';
                            statusIcon = 'fa-user';
                            statusLabel = '已入住';
                        } else if (bed.bedStatus === 3) {
                            statusClass = 'status-maintenance';
                            statusIcon = 'fa-tools';
                            statusLabel = '维修';
                        }

                        // 备注中的入住人信息（如果有的话）
                        var occupantText = '';
                        if (bed.bedStatus === 2 && bed.remarks) {
                            var match = bed.remarks.match(/^(.+?)\(入住/);
                            if (match) {
                                occupantText = match[1];
                            } else {
                                occupantText = bed.remarks;
                            }
                        }

                        html += '<div class="bed-item ' + statusClass + '" data-bed-id="' + bed.id + '" data-building="' + escapeHtml(bed.building || '') + '" data-room="' + (bed.roomNo || '') + '" data-status="' + (bed.bedStatus || 1) + '">' +
                            '    <div class="bed-left">' +
                            '        <div class="bed-icon"><i class="fas ' + statusIcon + '"></i></div>' +
                            '        <div>' +
                            '            <div class="bed-label">' +
                            '                床位 ' + escapeHtml(bed.bedNo || '') +
                            '                <small>' + statusLabel + '</small>' +
                            '            </div>' +
                            (occupantText ? '<div class="bed-occupant"><i class="fas fa-user"></i> ' + escapeHtml(occupantText) + '</div>' : '') +
                            '        </div>' +
                            '    </div>' +
                            '    <div class="bed-actions">' +
                            '        <button class="btn-icon btn-edit" onclick="openEdit(' + bed.id + ')" title="编辑">' +
                            '            <i class="fas fa-pen"></i>' +
                            '        </button>' +
                            '        <button class="btn-icon btn-status" onclick="openStatus(' + bed.id + ')" title="修改状态">' +
                            '            <i class="fas fa-exchange-alt"></i>' +
                            '        </button>' +
                            (bed.bedStatus === 1 ? '<button class="btn-icon btn-assign" onclick="openAssign(' + bed.id + ')" title="分配床位">' +
                            '            <i class="fas fa-user-plus"></i>' +
                            '        </button>' : '') +
                            (bed.bedStatus === 2 ? '<button class="btn-icon btn-swap" onclick="openSwap(' + bed.id + ')" title="换床">' +
                            '            <i class="fas fa-arrows-alt-h"></i>' +
                            '        </button>' : '') +
                            '    </div>' +
                            '</div>';
                    });

                    html += '</div></div>'; // 关闭 beds-container 和 room-card
                });

                html += '</div></div></div></div>'; // 关闭 room-grid, card-body, collapse, building-card
                first = false;
            });

            $('#bedVisualContainer').html(html).show();
            $('#noMatchContainer').hide();
        }

        // ==================== 搜索 ====================
        function searchBeds() {
            var building = $('#searchBuilding').val();
            var roomNo = $('#searchRoomNo').val().trim();
            var status = $('#searchStatus').val();

            var filtered = allBeds;

            if (building) {
                filtered = filtered.filter(function(b) {
                    return b.building === building;
                });
            }
            if (roomNo) {
                filtered = filtered.filter(function(b) {
                    return b.roomNo && b.roomNo.toString() === roomNo;
                });
            }
            if (status) {
                filtered = filtered.filter(function(b) {
                    return b.bedStatus === parseInt(status);
                });
            }

            if (filtered.length === 0) {
                $('#bedVisualContainer').hide();
                $('#emptyContainer').hide();
                $('#noMatchContainer').show();
            } else {
                renderBeds(filtered);
            }
        }

        function resetSearch() {
            $('#searchBuilding').val('');
            $('#searchRoomNo').val('');
            $('#searchStatus').val('');
            renderBeds(allBeds);
        }

        // ==================== 状态标签（表格兼容保留） ====================
        function getStatusBadge(status) {
            if (status === 1) return '<span class="badge badge-success">空闲</span>';
            if (status === 2) return '<span class="badge badge-warning">已入住</span>';
            if (status === 3) return '<span class="badge badge-secondary">维修</span>';
            return '<span class="badge badge-light">未知</span>';
        }

        // ==================== 编辑弹窗 ====================
        function openEdit(id) {
            var bed = allBeds.find(function(b) { return b.id === id; });
            if (!bed) return;
            $('#editId').val(bed.id);
            $('#editBuilding').val(bed.building);
            $('#editRoomNo').val(bed.roomNo);
            $('#editBedNo').val(bed.bedNo);
            $('#editBedStatus').val(bed.bedStatus);
            $('#editRemarks').val(bed.remarks || '');
            $('#editModal').modal('show');
        }

        function submitEdit() {
            var id = $('#editId').val();
            var data = {
                building: $('#editBuilding').val().trim(),
                roomNo: parseInt($('#editRoomNo').val()),
                bedNo: $('#editBedNo').val().trim(),
                bedStatus: parseInt($('#editBedStatus').val()),
                remarks: $('#editRemarks').val().trim()
            };
            if (!data.building || !data.roomNo || !data.bedNo) {
                showToast('请填写楼栋、房间号和床位号', 'warning');
                return;
            }
            $.ajax({
                url: '/api/beds/' + id,
                type: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function(res) {
                    if (res.code === 200) {
                        showToast('更新成功', 'success');
                        $('#editModal').modal('hide');
                        loadBeds();
                    } else {
                        showToast(res.message || '更新失败', 'error');
                    }
                },
                error: function() {
                    showToast('网络异常，更新失败', 'error');
                }
            });
        }

        // ==================== 修改状态弹窗 ====================
        function openStatus(id) {
            $('#statusBedId').val(id);
            var bed = allBeds.find(function(b) { return b.id === id; });
            if (bed) {
                $('#newStatus').val(bed.bedStatus);
            }
            $('#statusModal').modal('show');
        }

        function submitStatusChange() {
            var id = $('#statusBedId').val();
            var status = parseInt($('#newStatus').val());
            $.ajax({
                url: '/api/beds/' + id + '/status',
                type: 'PATCH',
                contentType: 'application/json',
                data: JSON.stringify({ bedStatus: status }),
                success: function(res) {
                    if (res.code === 200) {
                        showToast('状态修改成功', 'success');
                        $('#statusModal').modal('hide');
                        loadBeds();
                    } else {
                        showToast(res.message || '修改失败', 'error');
                    }
                },
                error: function() {
                    showToast('网络异常，修改失败', 'error');
                }
            });
        }

        // ==================== 分配床位弹窗 ====================
        function loadCustomers() {
            $.get('/api/clients', function(res) {
                if (res.code === 200 && res.data) {
                    var sel = $('#assignCustomer');
                    sel.empty().append('<option value="">-- 请选择老人 --</option>');
                    $.each(res.data, function(i, c) {
                        sel.append('<option value="' + c.id + '">' + escapeHtml(c.name) + ' (ID: ' + c.id + ')</option>');
                    });
                }
            }).fail(function() {});
        }

        function openAssign(bedId) {
            $('#assignBedId').val(bedId);
            var sel = $('#assignCustomer');
            sel.html('<option value="" disabled>加载中...</option>');
            $.get('/api/clients', function(res) {
                if (res.code === 200 && res.data) {
                    sel.empty().append('<option value="">-- 请选择老人 --</option>');
                    $.each(res.data, function(i, c) {
                        sel.append('<option value="' + c.id + '">' + escapeHtml(c.name) + ' (ID: ' + c.id + ')</option>');
                    });
                }
            }).fail(function() {
                showToast('加载老人列表失败', 'error');
            });
            $('#assignModal').modal('show');
        }

        function submitAssign() {
            var bedId = $('#assignBedId').val();
            var customerId = $('#assignCustomer').val();
            if (!customerId) {
                showToast('请选择一位老人', 'warning');
                return;
            }
            $.ajax({
                url: '/api/beds/assign',
                type: 'POST',
                data: { customerId: customerId, bedId: bedId },
                success: function(res) {
                    if (res.code === 200) {
                        showToast('分配成功', 'success');
                        $('#assignModal').modal('hide');
                        loadBeds();
                    } else {
                        showToast(res.message || '分配失败', 'error');
                    }
                },
                error: function() {
                    showToast('网络异常，分配失败', 'error');
                }
            });
        }

        // ==================== 换床弹窗 ====================
        function openSwap(bedId) {
            var bed = allBeds.find(function(b) { return b.id === bedId; });
            if (!bed) return;
            $('#swapOldBedId').val(bed.id);
            $('#swapOldBedNo').val(bed.bedNo);
            $('#swapCurrentBed').val(bed.building + ' - ' + bed.roomNo + ' - ' + bed.bedNo);
            $('#swapBuilding').val(bed.building);
            $('#swapRoomNo').val(bed.roomNo);
            $('#swapNewBedNo').val('');
            $('#swapClientId').val('');
            $('#swapModal').modal('show');
        }

        function submitSwap() {
            var data = {
                building: $('#swapBuilding').val().trim(),
                roomNo: parseInt($('#swapRoomNo').val()),
                oldBedNo: $('#swapOldBedNo').val(),
                newBedNo: $('#swapNewBedNo').val().trim(),
                clientId: parseInt($('#swapClientId').val())
            };
            if (!data.building || !data.roomNo || !data.newBedNo || !data.clientId) {
                showToast('请填写完整换床信息', 'warning');
                return;
            }
            $.ajax({
                url: '/api/beds/swap',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function(res) {
                    if (res.code === 200) {
                        showToast('换床成功', 'success');
                        $('#swapModal').modal('hide');
                        loadBeds();
                    } else {
                        showToast(res.message || '换床失败', 'error');
                    }
                },
                error: function() {
                    showToast('网络异常，换床失败', 'error');
                }
            });
        }

        // showToast 和 escapeHtml 在 common.js 中已有定义，此处不再重复
    </script>

    <!-- ==================== 编辑弹窗 ==================== -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h6 class="modal-title"><i class="fas fa-edit text-primary"></i> 编辑床位</h6>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>楼栋 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="editBuilding" placeholder="如：A栋">
                </div>
                <div class="form-group">
                    <label>房间号 <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="editRoomNo" placeholder="如：101">
                </div>
                <div class="form-group">
                    <label>床位号 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="editBedNo" placeholder="如：01">
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select class="form-control" id="editBedStatus">
                        <option value="1">空闲</option>
                        <option value="2">已入住</option>
                        <option value="3">维修</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea class="form-control" id="editRemarks" rows="2" placeholder="备注信息"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary btn-sm" onclick="submitEdit()">
                    <i class="fas fa-save"></i> 保存
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ==================== 修改状态弹窗 ==================== -->
<div class="modal fade" id="statusModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title"><i class="fas fa-exchange-alt text-info"></i> 修改床位状态</h6>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="statusBedId">
                <div class="form-group">
                    <label>选择新状态：</label>
                    <select class="form-control" id="newStatus">
                        <option value="1">空闲</option>
                        <option value="2">已入住</option>
                        <option value="3">维修</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-info btn-sm" onclick="submitStatusChange()">
                    <i class="fas fa-check"></i> 确认修改
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ==================== 分配床位弹窗 ==================== -->
<div class="modal fade" id="assignModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title"><i class="fas fa-user-plus text-success"></i> 分配床位</h6>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="assignBedId">
                <div class="form-group">
                    <label>选择老人 <span class="text-danger">*</span></label>
                    <select class="form-control" id="assignCustomer" style="width:100%;">
                        <option value="">-- 请选择老人 --</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-success btn-sm" onclick="submitAssign()">
                    <i class="fas fa-check"></i> 确认分配
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ==================== 换床弹窗 ==================== -->
<div class="modal fade" id="swapModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title"><i class="fas fa-arrows-alt-h text-warning"></i> 换床</h6>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="swapOldBedId">
                <input type="hidden" id="swapOldBedNo">
                <div class="form-group">
                    <label>当前床位</label>
                    <input type="text" class="form-control" id="swapCurrentBed" readonly>
                </div>
                <div class="form-group">
                    <label>目标楼栋</label>
                    <input type="text" class="form-control" id="swapBuilding" placeholder="如：A栋">
                </div>
                <div class="form-group">
                    <label>目标房间号</label>
                    <input type="number" class="form-control" id="swapRoomNo" placeholder="如：101">
                </div>
                <div class="form-group">
                    <label>目标床位号 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="swapNewBedNo" placeholder="如：02">
                </div>
                <div class="form-group">
                    <label>老人ID <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="swapClientId" placeholder="老人ID">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-warning btn-sm" onclick="submitSwap()">
                    <i class="fas fa-check"></i> 确认换床
                </button>
            </div>
        </div>
    </div>
</div>

</th:block>
</body>
</html>
