<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title th:text="'护理记录'">护理记录</title>
</head>
<body>
    <th:block layout:fragment="content">
        <div class="page-title">
            <i class="fas fa-clipboard-list"></i> 护理记录
        </div>

        <!-- 搜索栏 -->
        <div class="search-bar">
            <form class="form-inline">
                <div class="form-group mr-3">
                    <label class="mr-2"><i class="fas fa-user"></i> 老人：</label>
                    <select class="form-control form-control-sm" id="clientFilter">
                        <option value="">全部老人</option>
                    </select>
                </div>
                <div class="form-group mr-3">
                    <label class="mr-2"><i class="fas fa-notes-medical"></i> 项目：</label>
                    <select class="form-control form-control-sm" id="itemFilter">
                        <option value="">全部项目</option>
                    </select>
                </div>
                <div class="form-group mr-3">
                    <label class="mr-2"><i class="fas fa-user-md"></i> 护理员：</label>
                    <select class="form-control form-control-sm" id="assistantFilter">
                        <option value="">全部护理员</option>
                    </select>
                </div>
                <div class="form-group mr-3">
                    <label class="mr-2"><i class="fas fa-calendar-alt"></i> 日期：</label>
                    <input type="date" class="form-control form-control-sm mr-1" id="startDate" style="width:140px;">
                    <span class="mr-1">~</span>
                    <input type="date" class="form-control form-control-sm" id="endDate" style="width:140px;">
                </div>
                <button type="button" class="btn btn-primary btn-sm mr-2" id="searchBtn">
                    <i class="fas fa-search"></i> 查询
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm mr-2" id="resetBtn">
                    <i class="fas fa-undo"></i> 重置
                </button>
                <a th:href="@{/page/nursing-records/add}" class="btn btn-success btn-sm">
                    <i class="fas fa-plus"></i> 新增记录
                </a>
            </form>
        </div>

        <!-- 数据卡片 -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-list"></i> 护理记录列表
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>老人姓名</th>
                                <th>护理项目</th>
                                <th>护理员</th>
                                <th>护理时间</th>
                                <th>执行次数</th>
                                <th>备注</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="recordTableBody">
                            <tr id="noDataRow">
                                <td colspan="8" class="empty-state">
                                    <i class="fas fa-inbox"></i>
                                    <p>暂无护理记录</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 删除确认弹窗 -->
        <div class="modal fade" id="deleteModal" tabindex="-1" role="dialog">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title"><i class="fas fa-exclamation-triangle text-warning"></i> 确认删除</h5>
                        <button type="button" class="close" data-dismiss="modal">&times;</button>
                    </div>
                    <div class="modal-body">
                        <p>确定要删除这条护理记录吗？此操作不可撤销。</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">确认删除</button>
                    </div>
                </div>
            </div>
        </div>
    </th:block>

    <th:block layout:fragment="script-extra">
    <script>
    $(function() {
        var deleteId = null;
        var COL_SPAN = 8;

        // ========== 初始化：加载下拉框数据 ==========

        // 加载老人下拉
        $.get('/api/clients', function(resp) {
            var clients = resp.data || resp || [];
            var sel = $('#clientFilter');
            clients.forEach(function(c) {
                if (!c.deleted) {
                    sel.append('<option value="' + c.id + '">' + c.name + '</option>');
                }
            });
        });

        // 加载护理项目下拉
        $.get('/api/nursing-items', function(resp) {
            var items = resp.data || resp || [];
            var sel = $('#itemFilter');
            items.forEach(function(item) {
                if (!item.deleted) {
                    sel.append('<option value="' + item.id + '">' + item.name + '</option>');
                }
            });
        });

        // 加载护理员（操作员）下拉
        $.get('/api/operators', function(resp) {
            var operators = resp.data || resp || [];
            var sel = $('#assistantFilter');
            operators.forEach(function(op) {
                sel.append('<option value="' + op.loginCode + '">' + op.realName + '</option>');
            });
        });

        // ========== 组合查询函数 ==========

        function loadRecords(params) {
            // 构建查询参数
            var query = [];
            if (params.clientId) {
                query.push('clientId=' + encodeURIComponent(params.clientId));
            }
            if (params.nursingItemId) {
                query.push('nursingItemId=' + encodeURIComponent(params.nursingItemId));
            }
            if (params.healthAssistantId) {
                query.push('healthAssistantId=' + encodeURIComponent(params.healthAssistantId));
            }
            if (params.startTime) {
                query.push('startTime=' + encodeURIComponent(params.startTime));
            }
            if (params.endTime) {
                query.push('endTime=' + encodeURIComponent(params.endTime));
            }

            var url = '/api/nursing-records/search';
            if (query.length > 0) {
                url += '?' + query.join('&');
            }

            showLoading('#recordTableBody', COL_SPAN);
            $.get(url, function(resp) {
                var records = resp.data || resp || [];
                var tbody = $('#recordTableBody');
                tbody.empty();
                if (records.length === 0) {
                    showEmpty('#recordTableBody', COL_SPAN, '暂无护理记录');
                    return;
                }
                records.forEach(function(r, idx) {
                    var clientName = r.clientName || '-';
                    var itemName = r.nursingItemName || '-';
                    var nurseName = r.healthAssistantName || r.healthAssistantId || '-';
                    var time = r.nursingTime ? formatDateTime(r.nursingTime) : '-';
                    tbody.append(
                        '<tr>' +
                            '<td>' + (idx + 1) + '</td>' +
                            '<td>' + escapeHtml(clientName) + '</td>' +
                            '<td>' + escapeHtml(itemName) + '</td>' +
                            '<td>' + escapeHtml(nurseName) + '</td>' +
                            '<td>' + time + '</td>' +
                            '<td>' + (r.execQuantity || 0) + '</td>' +
                            '<td>' + (r.remarks ? escapeHtml(r.remarks) : '-') + '</td>' +
                            '<td>' +
                                '<button class="btn btn-outline-danger btn-sm btn-action delete-btn" data-id="' + r.id + '" title="删除">' +
                                    '<i class="fas fa-trash"></i>' +
                                '</button>' +
                            '</td>' +
                        '</tr>'
                    );
                });
            }).fail(function() {
                showEmpty('#recordTableBody', COL_SPAN, '加载失败，请稍后重试');
            });
        }

        // ========== 收集表单参数并执行查询 ==========

        function doSearch() {
            var params = {};

            var clientId = $('#clientFilter').val();
            if (clientId) {
                params.clientId = clientId;
            }

            var itemId = $('#itemFilter').val();
            if (itemId) {
                params.nursingItemId = itemId;
            }

            var assistantId = $('#assistantFilter').val();
            if (assistantId) {
                params.healthAssistantId = assistantId;
            }

            var startDate = $('#startDate').val();
            if (startDate) {
                params.startTime = startDate + 'T00:00:00';
            }

            var endDate = $('#endDate').val();
            if (endDate) {
                params.endTime = endDate + 'T23:59:59';
            }

            loadRecords(params);
        }

        // ========== 重置筛选条件 ==========

        function resetFilters() {
            $('#clientFilter').val('');
            $('#itemFilter').val('');
            $('#assistantFilter').val('');
            $('#startDate').val('');
            $('#endDate').val('');
            // 重置后重新查询（显示全部记录）
            doSearch();
        }

        // ========== 事件绑定 ==========

        // 查询按钮
        $('#searchBtn').click(function() {
            doSearch();
        });

        // 重置按钮
        $('#resetBtn').click(function() {
            resetFilters();
        });

        // 回车键触发查询
        $(document).keydown(function(e) {
            if (e.key === 'Enter') {
                doSearch();
            }
        });

        // ========== 删除逻辑 ==========

        $(document).on('click', '.delete-btn', function() {
            deleteId = $(this).data('id');
            $('#deleteModal').modal('show');
        });

        $('#confirmDeleteBtn').click(function() {
            if (deleteId) {
                $.ajax({
                    url: '/api/nursing-records/' + deleteId,
                    type: 'DELETE',
                    success: function(resp) {
                        if (resp.code === 200 || resp.success) {
                            $('#deleteModal').modal('hide');
                            doSearch();
                            showToast('删除成功', 'success');
                        } else {
                            showToast(resp.message || '删除失败', 'error');
                        }
                    },
                    error: function() {
                        showToast('删除失败，请稍后重试', 'error');
                    }
                });
            }
        });

        // ========== 初始加载（全部记录） ==========
        doSearch();
    });
    </script>
    </th:block>
</body>
</html>
